# Continuous integration: run the test suite on GitHub's computers after every push.
#
# The tests never download F1 data: they use synthetic signals and tiny fake
# results folders (docs/engineering_notes.md, "Conventions"). So this needs no API access, no cache,
# and none of the gitignored raw files. Checked before adding: the suite passes
# in a fresh clone, and every pinned package has a Linux wheel for Python 3.13.

name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # a fixed image, not ubuntu-latest: that label moves to Ubuntu 26 from 2026-10-19 (GitHub's
    # notice on our runs), and the test environment should change only when we change it
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # v7 of both run on Node 24 (their action.yml, checked 2026-11-12); v4/v5 ran on the
      # deprecated Node 20, which GitHub warned about on every run
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip                      # reuse downloaded packages between runs

      - name: Install the exact pinned versions
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run the tests
        env:
          MPLBACKEND: Agg                 # draw figures without a screen
        run: pytest -q
